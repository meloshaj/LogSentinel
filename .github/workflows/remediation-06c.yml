name: LogSentinel Remediation 06C Disposable Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-proof:
    name: Representative migration proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install migration harness dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Run disposable migration matrix
        run: python scripts/integration/remediation_06c_migration_harness.py

  disaster-recovery-proof:
    name: Remote backup, PITR, Valkey, and combined DR proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install DR harness dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
      - name: Build the approved PG16 backup runner image
        run: docker build -t logsentinel-06c-runner -f backend/Dockerfile .
      - name: Pull disposable object-store emulator
        run: docker pull quay.io/minio/minio@sha256:7274c266cc5ec1a4a8925a49d00f249487e426bf73954c992972081972ecfc49 # RELEASE.2024-05-07T06-41-25Z; multi-arch OCI index; runner selects amd64
      - name: Run disposable DR rehearsal
        run: python scripts/integration/remediation_06c_dr_harness.py
