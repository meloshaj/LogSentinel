# Repository-owned production authentication policy.
#
# The explicit replication record is required by pg_basebackup for the
# approved physical PITR base.  The Docker Compose network is private and
# limited to this deployment's 172.18.0.0/16 network.

local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     logsentinel     172.18.0.0/16           scram-sha-256
host    all             all             all                     scram-sha-256
