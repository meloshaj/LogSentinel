apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logsentinel.fullname" . }}-api
spec:
  replicas: {{ .Values.replicaCount.api | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "logsentinel.name" . }}-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "logsentinel.name" . }}-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "logsentinel.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds.api }}
      containers:
        - name: api
          image: {{ include "logsentinel.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.api.liveness.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.probes.api.liveness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.probes.api.liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.probes.api.liveness.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.api.liveness.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.api.readiness.path | default "/readiness" }}
              port: http
            initialDelaySeconds: {{ .Values.probes.api.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.api.readiness.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.probes.api.readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.probes.api.readiness.failureThreshold | default 2 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.api.liveness.path | default "/health" }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          {{- if .Values.resources.api }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "logsentinel.fullname" . }}-config
            - secretRef:
                name: {{ include "logsentinel.secretName" . }}
