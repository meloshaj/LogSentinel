apiVersion: v1
kind: Service
metadata:
  name: {{ include "logsentinel.fullname" . }}-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "logsentinel.name" . }}-api
    app.kubernetes.io/instance: {{ .Release.Name }}
