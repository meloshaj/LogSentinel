{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "logsentinel.fullname" . }}-database-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "logsentinel.name" . }}-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "logsentinel.fullname" . }}
          automountServiceAccountToken: false
          containers:
            - name: backup
              image: {{ include "logsentinel.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["bash", "/repo/scripts/backup_database.sh"]
              env:
                - {name: S3_BUCKET, value: {{ required "backup.bucket is required" .Values.backup.bucket | quote }}}
                - {name: S3_ENDPOINT, value: {{ .Values.backup.endpoint | quote }}}
                - {name: S3_REGION, value: {{ required "backup.region is required" .Values.backup.region | quote }}}
                - {name: BACKUP_CLEANUP_ENABLED, value: {{ .Values.backup.cleanupEnabled | quote }}}
                - {name: REQUIRE_REMOTE_BACKUP, value: {{ .Values.backup.requireRemoteUpload | quote }}}
              envFrom:
                - configMapRef: {name: {{ include "logsentinel.fullname" . }}-config}
                - secretRef: {name: {{ required "backup.existingSecret is required when backup is enabled" .Values.backup.existingSecret }}}
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
{{- end }}
