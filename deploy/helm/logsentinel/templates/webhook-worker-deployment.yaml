{{- if .Values.workers.webhook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logsentinel.fullname" . }}-webhook-worker
spec:
  replicas: {{ .Values.replicaCount.webhookWorker }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "logsentinel.name" . }}-webhook-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "logsentinel.name" . }}-webhook-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "logsentinel.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds.webhookWorker }}
      containers:
        - name: webhook-worker
          image: {{ include "logsentinel.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.cli.worker"]
          args: ["run", "webhook"]
          env:
            - name: WORKER_INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          envFrom:
            - configMapRef: {name: {{ include "logsentinel.fullname" . }}-config}
            - secretRef: {name: {{ include "logsentinel.secretName" . }}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: {{ .Values.probes.worker.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.worker.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.worker.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.worker.failureThreshold }}
          readinessProbe:
            exec:
              command: ["python", "-m", "app.cli.worker", "healthcheck", "webhook"]
            initialDelaySeconds: {{ .Values.probes.worker.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.worker.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.worker.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.worker.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.webhookWorker | nindent 12 }}
{{- end }}
