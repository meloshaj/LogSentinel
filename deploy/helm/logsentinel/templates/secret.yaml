{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logsentinel.secretName" . }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ required "secret.jwtSecretKey must be set" .Values.secret.jwtSecretKey | b64enc | quote }}
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword must be set" .Values.secret.postgresPassword | b64enc | quote }}
  ENCRYPTION_KEY: {{ required "secret.encryptionKey must be set" .Values.secret.encryptionKey | b64enc | quote }}
  INGEST_API_KEYS: {{ required "secret.ingestionApiKeys must be set" .Values.secret.ingestionApiKeys | b64enc | quote }}
  METRICS_TOKEN: {{ required "secret.metricsToken must be set" .Values.secret.metricsToken | b64enc | quote }}
  {{- if .Values.workers.archive.enabled }}
  S3_ACCESS_KEY_ID: {{ required "secret.s3AccessKeyId is required for archive" .Values.secret.s3AccessKeyId | b64enc | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "secret.s3SecretAccessKey is required for archive" .Values.secret.s3SecretAccessKey | b64enc | quote }}
  {{- end }}
{{- end }}
