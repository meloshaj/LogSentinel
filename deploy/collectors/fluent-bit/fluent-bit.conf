[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Parser            docker
    Tag               kube.*
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /var/log/syslog
    Tag               host.syslog

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off

[FILTER]
    Name          nest
    Match         kube.*
    Operation     lift
    Nested_under  kubernetes
    Add_prefix    k8s_

[FILTER]
    Name          modify
    Match         kube.*
    Rename        k8s_container_name service_name

[FILTER]
    Name          record_modifier
    Match         *
    Record        service_name host-system
    Condition     Key_does_not_exist service_name

[OUTPUT]
    Name          http
    Match         *
    Host          ${LOGSENTINEL_HOST}
    Port          ${LOGSENTINEL_PORT}
    URI           /api/v1/ingest/bulk
    Header        X-API-Key ${LOGSENTINEL_API_KEY}
    Header        Content-Type application/x-ndjson
    Format        json_lines
    Compress      gzip
    Retry_Limit   False
