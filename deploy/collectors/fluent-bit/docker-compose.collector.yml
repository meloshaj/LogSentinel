version: '3.8'

services:
  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: logsentinel-fluent-bit
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/log/containers:/var/log/containers:ro
      - /var/log/syslog:/var/log/syslog:ro
    environment:
      - LOGSENTINEL_HOST=${LOGSENTINEL_HOST:-localhost}
      - LOGSENTINEL_PORT=${LOGSENTINEL_PORT:-8000}
      - LOGSENTINEL_API_KEY=${LOGSENTINEL_API_KEY:-dev-local-key}
    network_mode: "host" # Useful for reaching localhost backends
    restart: always
