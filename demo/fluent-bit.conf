[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         tail
    Path         /var/log/mock-services/*.log
    Tag          mock.*
    Read_from_Head True
    Refresh_Interval 1

[OUTPUT]
    Name         http
    Match        mock.*
    Host         backend
    Port         8000
    URI          /api/v1/ingest/bulk
    Format       ndjson
    Header       X-API-Key ${SMOKE_TEST_API_KEY}
    Compress     gzip
